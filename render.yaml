# ==============================================================================
# CONLIZ PLATFORM — RENDER BLUEPRINT (1 clique)
# Deploy: https://render.com/deploy?repo=https://github.com/tgsf18/conliz
#
# O banco é o Postgres do Supabase (externo). Crie o banco lá primeiro e
# preencha as 3 variáveis de ambiente no painel do Render (marcadas sync: false).
# ==============================================================================

services:
  # ---------------------------------------------------------------- BACKEND
  - type: web
    name: conliz-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      # --- Supabase (preencher no painel) ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # --- Segredos (gerados pelo Render) ---
      - key: JWT_SECRET
        generateValue: true
      - key: CONLIZ_ADMIN_PASSWORD
        generateValue: true
      - key: CONLIZ_ADMIN_EMAIL
        value: admin@conliz.com.br
      - key: CONLIZ_ADMIN_NAME
        value: Diretoria Conliz
      - key: TOTP_ISSUER
        value: Conliz Construtora
      - key: JWT_EXPIRATION_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRATION_DAYS
        value: "7"
      # Cookies Secure + CORS: ajustar depois do 1º deploy do frontend
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------- FRONTEND
  - type: web
    name: conliz-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    envVars:
      # URL pública do backend (ex.: https://conliz-api.onrender.com)
      - key: BACKEND_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
