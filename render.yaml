# ==============================================================================
# CONLIZ PLATFORM — RENDER BLUEPRINT (1 clique)
# Deploy: https://render.com/deploy?repo=https://github.com/tgsf18/conliz
#
# Um único serviço: o build do Next é embutido no jar do Spring Boot, então
# site, painel e API vivem no mesmo domínio e na mesma porta (8080).
# O banco é o Postgres do Supabase (externo): crie o banco lá primeiro e
# preencha as 3 variáveis marcadas sync: false no painel do Render.
# ==============================================================================

services:
  - type: web
    name: conliz
    runtime: docker
    plan: free
    # Região do Render não muda depois de criada. O Supabase ficará em São Paulo
    # (sa-east-1): escolha a região mais próxima ao criar o serviço.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      # --- Supabase (preencher no painel) ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # --- Segredos ---
      # JWT_SECRET: gerado pelo Render (nunca fica no repositório).
      - key: JWT_SECRET
        generateValue: true
      # Senha de bootstrap do admin: você define no painel (sync: false).
      # Não use generateValue: se o serviço for recriado, a senha nova não substitui
      # a do usuário que já existe no banco e você perde o acesso ao painel.
      - key: CONLIZ_ADMIN_PASSWORD
        sync: false
      - key: CONLIZ_ADMIN_EMAIL
        value: admin@conliz.com.br
      - key: CONLIZ_ADMIN_NAME
        value: Diretoria Conliz
      - key: TOTP_ISSUER
        value: Conliz Construtora
      - key: JWT_EXPIRATION_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRATION_DAYS
        value: "7"
      # Site e API no mesmo domínio: CORS só importa para um domínio próprio.
      - key: COOKIE_SECURE
        value: "true"
      # Sem usuários de demonstração (rh@/comercial@/engenharia@) em produção.
      - key: CONLIZ_SEED_DEMO_USERS
        value: "false"
      # URL do serviço: o Render injeta RENDER_EXTERNAL_URL (a URL real, já com o
      # sufixo se o nome estiver em uso). Assim CORS/FRONTEND_URL nunca ficam errados.
      # Com domínio próprio, troque por https://seudominio.com.br (sync: false).
      - key: CORS_ALLOWED_ORIGINS
        value: ${RENDER_EXTERNAL_URL}
      - key: FRONTEND_URL
        value: ${RENDER_EXTERNAL_URL}
