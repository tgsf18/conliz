server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: conliz-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:conlizdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

conliz:
  jwt:
    secret: ${JWT_SECRET:4f8b9a2d3c1e5f7a9b0c2d4e6f8a0b1c3d5e7f9a1b3c5d7e9f0a2b4c6d8e0f1a}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Strict}
    domain: ${COOKIE_DOMAIN:}
  rate-limit:
    login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
    login-refill-minutes: ${RATE_LIMIT_LOGIN_REFILL_MINUTES:1}
    ip-capacity: ${RATE_LIMIT_IP_CAPACITY:60}
    ip-refill-minutes: ${RATE_LIMIT_IP_REFILL_MINUTES:1}
    lockout-attempts: ${ACCOUNT_LOCKOUT_ATTEMPTS:5}
    lockout-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:15}
  admin:
    email: ${CONLIZ_ADMIN_EMAIL:admin@conliz.com.br}
    password: ${CONLIZ_ADMIN_PASSWORD:ConlizAdmin2026!#Segura}
    name: ${CONLIZ_ADMIN_NAME:Diretoria Conliz}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
