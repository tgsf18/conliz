name: conliz-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: conliz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conliz}
      POSTGRES_USER: ${POSTGRES_USER:-conliz_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conliz_secure_pass_change_me_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conliz_admin} -d ${POSTGRES_DB:-conliz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - conliz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conliz-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conliz}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-conliz_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-conliz_secure_pass_change_me_in_prod}
      JWT_SECRET: ${JWT_SECRET:-4f8b9a2d3c1e5f7a9b0c2d4e6f8a0b1c3d5e7f9a1b3c5d7e9f0a2b4c6d8e0f1a}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CONLIZ_ADMIN_NAME: ${CONLIZ_ADMIN_NAME:-Diretoria Conliz}
      CONLIZ_ADMIN_EMAIL: ${CONLIZ_ADMIN_EMAIL:-admin@conliz.com.br}
      CONLIZ_ADMIN_PASSWORD: ${CONLIZ_ADMIN_PASSWORD:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-Conliz Construtora}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - conliz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conliz-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_LOGIN_PATH: ${ADMIN_LOGIN_PATH:-/gestao-conliz-acesso}
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - conliz-network

volumes:
  postgres_data:

networks:
  conliz-network:
    driver: bridge
